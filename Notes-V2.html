<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Notes</title>
<script src="scripts/dexie.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap');

:root {
  --bg: #0e0e10;
  --bg2: #17171b;
  --bg3: #1f1f25;
  --bg4: #28282f;
  --border: rgba(255,255,255,0.07);
  --border2: rgba(255,255,255,0.13);
  --text: #efefee;
  --muted: #7a7a88;
  --muted2: #45454f;
  --r: 14px;
  --r-sm: 8px;
  --font-h: 'Syne', sans-serif;
  --font-b: 'DM Sans', sans-serif;
  --sh: 0 4px 24px rgba(0,0,0,0.5);
  --primary: #b8ff57;
}
:root.light {
  --bg: #f6f2ea;
  --bg2: #fffdf7;
  --bg3: #f1ebdf;
  --bg4: #e6dece;
  --border: rgba(52,45,30,0.09);
  --border2: rgba(52,45,30,0.16);
  --text: #1f1c16;
  --muted: #6e6658;
  --muted2: #a49a87;
  --sh: 0 12px 36px rgba(77,65,36,0.12);
  --primary: #61a300;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{background:var(--bg);color:var(--text);font-family:var(--font-b);font-size:14px;line-height:1.5;min-height:100vh;}
</style>
</head>
<body>

</body>
</html>
